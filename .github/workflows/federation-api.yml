name: federation-api

on:
  push:
    branches: [main]
    paths:
      - "tools/federation-api/**"
      - ".github/workflows/federation-api.yml"
      - ".github/workflows/test-python.yml"
  pull_request:
    paths:
      - "tools/federation-api/**"
      - ".github/workflows/federation-api.yml"
      - ".github/workflows/test-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test-python.yml
    with:
      tool: federation-api
    secrets: inherit
