name: federation-api

on:
  push:
    branches: [main]
    paths:
      - "tools/federation-api/**"
      - ".github/workflows/federation-api.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/test-python.yml"
  pull_request:
    paths:
      - "tools/federation-api/**"
      - ".github/workflows/federation-api.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/test-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test-python.yml
    with:
      tool: federation-api
    secrets: inherit

  # On push to main (and by hand on main): the `nightly` image, after the tests pass.
  nightly:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tool: federation-api
      image: federation_api
      tags: type=raw,value=nightly
    secrets: inherit
